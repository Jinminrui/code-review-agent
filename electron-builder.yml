appId: com.code-review-agent.app
productName: Code Review Agent

directories:
  output: release

files:
  - "package.json"
  - from: "apps/review-shell/dist"
    to: "dist"
  - from: "packages/review-backend/dist"
    to: "node_modules/@app/review-backend/dist"
  - from: "apps/review-shell/renderer"
    to: "renderer"

extraResources: []

asar: true

mac:
  target: dmg

win:
  target: nsis
